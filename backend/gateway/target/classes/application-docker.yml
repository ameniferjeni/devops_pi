server:
  port: 8085

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: pfe-service
          uri: http://pfe-service:8081
          predicates:
            - Path=/api/pfe/**
        - id: chatbot-service
          uri: http://chatbot-service:8082
          predicates:
            - Path=/api/chatbot/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/
