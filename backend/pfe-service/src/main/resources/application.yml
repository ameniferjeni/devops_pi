server:
  port: 8081

spring:
  application:
    name: pfe-service
  datasource:
    url: jdbc:mysql://mysql:3306/codingfactory
    username: root
    password: ${MYSQL_ROOT_PASSWORD:codingfactory}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/

logging:
  level:
    root: INFO

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8084}
