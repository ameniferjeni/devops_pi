services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codingfactory}
      MYSQL_DATABASE: codingfactory
    # Pas de port 3306 sur l'hôte : MySQL local occupe souvent 3306.
    # Le backend accède à mysql:3306 via le réseau Docker.
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcodingfactory"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # legacy: monolithic backend removed in favor of microservices below

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${FRONTEND_HOST_PORT:-8083}:80"

  eureka:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - eureka
      - pfe-service
      - chatbot-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "${GATEWAY_HOST_PORT:-8090}:8085"

  pfe-service:
    build:
      context: ./backend/pfe-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka
      - ml-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codingfactory}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      ML_SERVICE_URL: http://ml-service:8084
    ports:
      - "${PFE_HOST_PORT:-8081}:8081"

  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-codingfactory}@mysql:3306/codingfactory
    depends_on:
      - mysql
    ports:
      - "${ML_HOST_PORT:-8084}:8084"
    volumes:
      - ml_model_data:/app/model_store

  chatbot-service:
    build:
      context: ./backend/chatbot-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codingfactory}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "${CHATBOT_HOST_PORT:-8082}:8082"

volumes:
  mysql_data:
  ml_model_data:
